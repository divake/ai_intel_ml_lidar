# Nav2 LIVE config — teach-and-repeat on the Scout, FAST-LIO2 localization.
# Frames: world = odom_lio (FAST-LIO2 + the taught path's frame); robot = rslidar.
# No map_server/global planner — we FOLLOW the taught path; local costmap + collision
# monitor handle real-time obstacles. cmd_vel chain:
#   controller(cmd_vel_nav) -> velocity_smoother(cmd_vel_smoothed) -> collision_monitor(cmd_vel -> Scout)
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50
      stateful: True
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.20            # speed cap
      vx_min: -0.05
      vy_max: 0.0
      wz_max: 0.6
      ax_max: 0.5
      ax_min: -0.7
      az_max: 1.0
      iteration_count: 1
      prune_distance: 1.6
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}
      CostCritic: {enabled: true, cost_power: 1, cost_weight: 4.0, critical_cost: 300.0, consider_footprint: false, collision_cost: 1000000.0, near_goal_distance: 1.0}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 12.0, max_path_occupancy_ratio: 0.05, trajectory_point_step: 4, threshold_to_consider: 0.5, offset_from_furthest: 20, use_path_orientations: false}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.4}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.5, max_angle_to_furthest: 1.0, mode: 0}

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_lio
      robot_base_frame: rslidar
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "rslidar"
    odom_frame_id: "odom_lio"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0
    stop_pub_timeout: 0.5
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"        # FORWARD box only -> ignores side walls in a corridor
      points: "[0.65, 0.28, 0.65, -0.28, 0.0, -0.28, 0.0, 0.28]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "stop_zone"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.4]
    min_velocity: [-0.10, 0.0, -0.4]
    max_accel: [0.5, 0.0, 0.6]
    max_decel: [-0.7, 0.0, -0.8]
    odom_topic: "odom"
    odom_duration: 0.1
