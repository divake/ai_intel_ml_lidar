# slam_toolbox offline mapping on the corridor2.0 bag (project 03, Phase A).
# Uses FAST-LIO2's odometry (odom_lio -> rslidar, in the bag's /tf) as the odom
# source, + a 2D /scan from pointcloud_to_laserscan, and adds LOOP CLOSURE +
# pose-graph optimization -> a globally-consistent 2D occupancy grid for Nav2.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    # frames: treat the LiDAR as the base; FAST-LIO2 gives odom_lio -> rslidar
    map_frame: map
    odom_frame: odom_lio
    base_frame: rslidar
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 30.0
    minimum_time_between_scans: 0.0
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # keyframing (process when the robot has actually moved)
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.2

    # scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # ---- LOOP CLOSURE (the whole point of Phase A) ----
    do_loop_closing: true
    loop_search_maximum_distance: 6.0
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
